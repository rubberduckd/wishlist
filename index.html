<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8"/>
	<title>✦ Wishlist</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"/>
	<meta name="wb_main" content="wb_element c019c0c32c9b77c9cb774f03a2df46467b94c8c7878956c23547bad2be882d26" />
	<link rel="icon" href="favicon.ico" sizes="any"/>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script defer src="render.js"></script>

	<style type="text/css">
		:root {
			--bg-0: #04100f;
			--bg-1: #07211e;
			--glass: rgba(255, 255, 255, 0.05);
			--glass-brd: rgba(255, 255, 255, 0.12);
			--accent-a: #44bfb7;   /* teal       */
			--accent-b: #9ff0ea;   /* aqua       */
			--accent-c: #1f8f88;   /* deep teal  */
			--ink: #eafbf9;
			--ink-dim: #a8cfca;
		}

		* { box-sizing: border-box; }

		html, body { background: var(--bg-0); }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			font-family: "Poppins", system-ui, sans-serif;
			overflow-x: hidden;
			position: relative;
		}

		/* Animated aurora backdrop */
		body::before {
			content: "";
			position: fixed;
			inset: -25%;
			z-index: -2;
			background:
				radial-gradient(40% 40% at 20% 20%, rgba(68, 191, 183, 0.38), transparent 60%),
				radial-gradient(45% 45% at 80% 15%, rgba(31, 143, 136, 0.32), transparent 60%),
				radial-gradient(50% 50% at 50% 90%, rgba(159, 240, 234, 0.26), transparent 60%),
				var(--bg-1);
			filter: blur(10px);
			animation: drift 22s ease-in-out infinite alternate;
		}
		/* Subtle grain/vignette */
		body::after {
			content: "";
			position: fixed;
			inset: 0;
			z-index: -1;
			background: radial-gradient(120% 90% at 50% 0%, transparent 55%, rgba(0, 0, 0, 0.6));
			pointer-events: none;
		}

		@keyframes drift {
			0%   { transform: translate3d(-4%, -2%, 0) scale(1.05) rotate(0deg); }
			50%  { transform: translate3d(3%, 2%, 0) scale(1.12) rotate(4deg); }
			100% { transform: translate3d(-2%, 3%, 0) scale(1.05) rotate(-3deg); }
		}

		.shell { max-width: 1180px; margin: 0 auto; padding: 0 1.1rem 5rem; }

		/* ---- Hero ---- */
		.hero { text-align: center; padding: 4.5rem 1rem 2.5rem; }
		.hero .kicker {
			font-size: .8rem;
			letter-spacing: .42em;
			text-transform: uppercase;
			color: var(--ink-dim);
			margin-bottom: 1rem;
		}
		.hero h1 {
			font-family: "Sora", sans-serif;
			font-weight: 800;
			font-size: clamp(2.6rem, 7vw, 5rem);
			line-height: 1.02;
			margin: 0;
			background: linear-gradient(100deg, var(--accent-c), var(--accent-a) 45%, var(--accent-b));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			filter: drop-shadow(0 6px 30px rgba(68, 191, 183, 0.45));
		}
		.hero p { color: var(--ink-dim); margin: 1rem auto 0; max-width: 38rem; font-weight: 300; }

		/* ---- Nav pills (rendered into #myTab) ---- */
		.navwrap {
			position: sticky;
			top: .75rem;
			z-index: 20;
			margin: 0 auto 2.5rem;
			width: fit-content;
			max-width: 100%;
		}
		#myTab.nav {
			gap: .35rem;
			flex-wrap: wrap;
			justify-content: center;
			padding: .4rem;
			border-radius: 999px;
			background: var(--glass);
			border: 1px solid var(--glass-brd);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
		}
		#myTab .nav-link {
			border: 0;
			border-radius: 999px;
			padding: .5rem 1.15rem;
			font-weight: 500;
			font-size: .92rem;
			color: var(--ink-dim);
			background: transparent;
			transition: color .2s, background .2s, transform .2s;
		}
		#myTab .nav-link:hover { color: var(--ink); transform: translateY(-1px); }
		#myTab .nav-link.active {
			color: #042421;
			font-weight: 600;
			background: linear-gradient(100deg, var(--accent-a), var(--accent-b));
			box-shadow: 0 6px 22px rgba(68, 191, 183, 0.5);
		}

		/* ---- Card grid (rendered by render.js) ---- */
		.tab-pane { animation: rise .5s ease both; }
		@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

		.wish-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
			gap: 1.4rem;
		}

		.wish-card {
			position: relative;
			border-radius: 20px;
			overflow: hidden;
			background: var(--glass);
			border: 1px solid var(--glass-brd);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
			transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .35s;
		}
		/* Glow ring on hover */
		.wish-card::after {
			content: "";
			position: absolute;
			inset: 0;
			border-radius: inherit;
			padding: 1px;
			background: linear-gradient(135deg, var(--accent-c), var(--accent-a), var(--accent-b));
			-webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
			-webkit-mask-composite: xor;
			mask-composite: exclude;
			opacity: 0;
			transition: opacity .35s;
			pointer-events: none;
		}
		.wish-card:hover {
			transform: translateY(-8px);
			box-shadow: 0 22px 50px rgba(68, 191, 183, 0.4);
			border-color: transparent;
		}
		.wish-card:hover::after { opacity: 1; }

		.wish-card-img {
			position: relative;
			aspect-ratio: 1 / 1;
			overflow: hidden;
			background: rgba(0, 0, 0, 0.25);
		}
		.wish-card-img img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform .5s cubic-bezier(.2,.8,.2,1);
		}
		.wish-card:hover .wish-card-img img { transform: scale(1.08); }

		.wish-card-body { padding: .95rem 1.05rem 1.1rem; }
		.wish-card-title {
			font-family: "Sora", sans-serif;
			font-size: 1.02rem;
			font-weight: 600;
			margin: 0 0 .35rem;
			line-height: 1.25;
		}
		.wish-meta {
			display: block;
			font-size: .82rem;
			color: var(--ink-dim);
			margin-top: .15rem;
		}
		.wish-meta-label { color: rgba(255,255,255,0.45); margin-right: .35rem; }

		.wish-price {
			display: inline-block;
			margin-top: .7rem;
			padding: .28rem .7rem;
			border-radius: 999px;
			font-size: .82rem;
			font-weight: 600;
			color: #042421;
			background: linear-gradient(100deg, var(--accent-a), var(--accent-b));
			box-shadow: 0 4px 14px rgba(68, 191, 183, 0.4);
		}

		/* ---- Home / freeform panes ---- */
		.home-pane {
			text-align: center;
			padding: 2rem 1rem;
			max-width: 46rem;
			margin: 0 auto;
		}
		.home-pane h1 {
			font-family: "Sora", sans-serif;
			font-weight: 800;
			background: linear-gradient(100deg, var(--accent-c), var(--accent-b));
			-webkit-background-clip: text; background-clip: text; color: transparent;
		}
		.home-pane p { color: var(--ink-dim); font-weight: 300; }

		.load-error { color: #ff8fa3; text-align: center; padding: 3rem; }
	</style>
</head>
<body>
	<header class="hero">
		<div class="kicker">✦ personal collection ✦</div>
		<h1>Wishlist</h1>
		<p>A curated lineup of figures &amp; plushies I'm hunting for. Browse by series below.</p>
	</header>

	<div class="shell">
		<div class="navwrap">
			<ul class="nav" id="myTab" role="tablist"></ul>
		</div>
		<div class="tab-content" id="myTabContent"></div>
	</div>
</body>
</html>
